<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKTCLOCK — Market Hours</title>
<meta name="description" content="Live open and close times, session countdowns and kill zones for the world's major equity, futures and FX markets, in your local timezone.">
<meta name="theme-color" content="#0a0c0f">
<link rel="canonical" href="https://www.mktclock.xyz/">
<meta property="og:type" content="website">
<meta property="og:title" content="MKTCLOCK — Market Hours">
<meta property="og:description" content="Live market hours, session countdowns and kill zones in your local timezone.">
<meta property="og:url" content="https://www.mktclock.xyz/">
<meta property="og:image" content="https://www.mktclock.xyz/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--bg2:#0f1217;--bg3:#151a22;--border:#1e2530;--border2:#252e3d;--text:#dde6f0;--text2:#9aabc0;--text3:#7c8fa6;--green:#00e676;--green-dim:#00b35a;--green-bg:rgba(0,230,118,.06);--red:#ff4444;--yellow:#ffd740;--yellow-bg:rgba(255,215,64,.06);--blue:#4db8ff;--blue-bg:rgba(77,184,255,.06);--accent:#2563eb;--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:1000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg2)}
.logo{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--text2)}
.logo span{color:var(--blue)}
.header-clock{text-align:right}
#local-time{font-size:22px;font-weight:500;color:var(--text);letter-spacing:.05em;font-variant-numeric:tabular-nums}
#local-date{font-size:11px;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
#local-tz{font-size:11px;color:var(--text3);letter-spacing:.1em}
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.session-bar-wrap{margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:14px 16px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.25em;color:var(--text2);text-transform:uppercase;margin-bottom:10px}
.session-timeline{position:relative;height:28px;background:var(--bg);border-radius:2px;overflow:hidden;margin-bottom:8px}
.session-block{position:absolute;height:100%;border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;letter-spacing:.1em}
.session-block.active{opacity:.9}
.session-block.inactive{opacity:.32}
.session-block.asia{background:rgba(220,100,160,.25);color:#e06faa;border:1px solid rgba(220,100,160,.35)}
.session-block.europe{background:rgba(100,185,255,.22);color:#6ab9ff;border:1px solid rgba(100,185,255,.3)}
.session-block.us{background:rgba(255,215,64,.2);color:var(--yellow);border:1px solid rgba(255,215,64,.25)}
.session-block.overlap{background:rgba(255,100,50,.35);color:#ff9060;border:1px solid rgba(255,100,50,.4)}
.session-block.pre-market{background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.07) 3px,rgba(255,255,255,.07) 6px)}
.session-block.pre-market.inactive{opacity:.5}
.time-ruler{display:flex;justify-content:space-between}
.session-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.session-bar-header .section-label{margin-bottom:0}
.session-bar-key{display:flex;align-items:center;gap:12px}
.key-item{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;color:var(--text2)}
.key-swatch{width:18px;height:9px;border-radius:2px;flex-shrink:0}
.key-swatch.hatch{background-image:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.15) 2px,rgba(255,255,255,.15) 4px);background-color:rgba(255,215,64,.12);border:.5px solid rgba(255,215,64,.3)}
.key-swatch.kz{background:rgba(200,40,40,.45);border:.5px solid rgba(200,40,40,.6)}
.kz-toggle-btn{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;color:var(--text2);padding:4px 0 4px 10px;border-left:.5px solid var(--border);user-select:none}
.kz-toggle-btn:hover{color:var(--text)}
.kz-pip{width:24px;height:12px;border-radius:6px;background:var(--bg);border:.5px solid var(--border2);position:relative;flex-shrink:0;transition:background .2s,border-color .2s}
.kz-pip.on{background:rgba(200,40,40,.7);border-color:rgba(200,40,40,.8)}
.kz-pip-dot{position:absolute;top:2px;left:2px;width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.kz-pip.on .kz-pip-dot{left:14px}
.kz-row{position:relative;height:8px;background:var(--bg);border-radius:0 0 2px 2px;overflow:hidden;margin-top:2px}
.kz-block{position:absolute;height:100%;background:rgba(200,40,40,.5)}
.kz-needle{position:absolute;top:0;width:1px;height:100%;background:rgba(255,255,255,.4);z-index:10}
.session-timeline.kz-active{border-radius:2px 2px 0 0;margin-bottom:0}
.time-ruler-tick{display:flex;flex-direction:column;align-items:center;gap:2px}
.time-ruler-utc{font-size:10px;color:var(--text3);letter-spacing:.05em}
.time-ruler-local{font-size:10px;color:var(--text);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.current-time-needle{position:absolute;top:0;width:1px;height:100%;background:rgba(255,255,255,.7);z-index:10}
.markets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px}
.market-card{background:var(--bg2);padding:14px 16px;transition:background .15s;position:relative}
.market-card:hover{background:var(--bg3)}
.market-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px}
.market-card.open::before{background:var(--green)}
.market-card.closed::before{background:var(--border2)}
.market-card.pre::before{background:var(--yellow)}
.market-card.break::before,.market-card.holiday::before{background:var(--blue)}
.market-card.closed .market-name,.market-card.closed .market-ticker,.market-card.closed .time-val,.market-card.closed .time-label,.market-card.closed .next-event{opacity:.62}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.market-name{font-size:13px;font-weight:500;color:var(--text);letter-spacing:.02em}
.market-ticker{font-size:11px;color:var(--text2);letter-spacing:.1em;margin-top:2px}
.status-badge{font-size:10px;font-weight:600;letter-spacing:.15em;padding:2px 7px;border-radius:2px;text-transform:uppercase;white-space:nowrap}
.status-badge.open{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,.2)}
.status-badge.closed{background:rgba(255,255,255,.03);color:var(--text3);border:1px solid var(--border)}
.status-badge.pre{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(255,215,64,.2)}
.status-badge.break,.status-badge.holiday{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(77,184,255,.2)}
.card-times{display:flex;gap:16px;margin-bottom:10px}
.time-block{flex:1}
.time-label{font-size:10px;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px}
.time-val{font-size:14px;font-weight:500;color:var(--text2);font-variant-numeric:tabular-nums}
.time-val.highlight{color:var(--text)}
.time-val small{font-size:10px;color:var(--text3);font-weight:400}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.next-event{font-size:11px;color:var(--text2)}
.next-event span{color:var(--text);font-variant-numeric:tabular-nums}
.session-progress{height:2px;background:var(--border);border-radius:1px;margin-top:10px;overflow:hidden}
.session-progress-fill{height:100%;border-radius:1px;background:var(--green-dim);transition:width 1s linear}
.market-card.closed .session-progress-fill{background:var(--text3);width:0!important}
.empty-state{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:28px 20px;text-align:center;color:var(--text2);font-size:12px;letter-spacing:.1em;margin-bottom:20px}
.empty-state strong{display:block;color:var(--text);font-size:13px;letter-spacing:.15em;margin-bottom:6px}
.forex-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px}
.forex-cell{background:var(--bg2);padding:12px 14px}
.fx-pair{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--text)}
.countdown-strip{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px}
.countdown-item{flex:1;background:var(--bg2);padding:12px 16px;display:flex;align-items:center;gap:12px}
.countdown-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.countdown-dot.open{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s ease infinite}
.countdown-dot.closed{background:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.countdown-label{font-size:11px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase}
.countdown-val{font-size:15px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;margin-top:1px}
.countdown-val.urgent{color:var(--yellow)}
.footer{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2);letter-spacing:.1em;gap:12px;flex-wrap:wrap}
.live-dot{display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin-right:5px;animation:pulse 2s ease infinite}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-header .section-label{margin-bottom:0}
.section-divider{flex:1;height:1px;background:var(--border)}
body.light{--bg:#f4f6f9;--bg2:#fff;--bg3:#e8ecf2;--border:#d0d9e8;--border2:#b8c5d9;--text:#1a2333;--text2:#4a5d78;--text3:#5f7391;--green:#00a854;--green-dim:#007a3d;--green-bg:rgba(0,168,84,.08);--yellow:#a86a00;--yellow-bg:rgba(193,127,0,.08);--blue:#1a73e8;--blue-bg:rgba(26,115,232,.08)}
body.light::before{display:none}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:4px}
.toggle-icon{font-size:14px;line-height:1}
.toggle-track{position:relative;width:36px;height:20px;background:var(--border2);border-radius:10px;transition:background .25s;flex-shrink:0}
.toggle-track.on{background:var(--accent)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle-track.on .toggle-thumb{transform:translateX(16px)}
.glass-bg{display:none}
@media(max-width:680px){
  .glass-bg{display:block;position:absolute;top:0;left:0;right:0;height:100vh;z-index:0;overflow:hidden;pointer-events:none}
  .glass-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.14}
  body.light .glass-blob{opacity:.32}
  .glass-blob.pink{width:240px;height:240px;background:#e06faa;top:0;left:-70px}
  .glass-blob.blue{width:280px;height:280px;background:#4d9fff;top:12%;right:-90px}
  .glass-blob.amber{width:220px;height:220px;background:#ffd740;top:30%;left:-60px}
  .glass-blob.pink2{width:220px;height:220px;background:#e06faa;top:50%;right:-70px}
  .glass-blob.blue2{width:240px;height:240px;background:#4d9fff;top:68%;left:-60px}
  .glass-blob.amber2{width:200px;height:200px;background:#ffd740;top:86%;right:-50px}
  .header,.main{position:relative;z-index:1}
  .header{padding:14px 16px;border-radius:0 0 24px 24px}
  .session-bar-wrap{background:rgba(15,16,24,.55);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.3)}
  body.light .session-bar-wrap{background:rgba(255,255,255,.55);border:.5px solid rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px rgba(0,0,0,.08)}
  .market-card,.countdown-item,.empty-state{background:rgba(255,255,255,.07);backdrop-filter:blur(20px) saturate(1.3);border:.5px solid rgba(255,255,255,.18);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.3)}
  .market-card::before{display:none}
  .markets-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:none;border:0;border-radius:0;overflow:visible}
  .market-card{padding:12px 14px}
  .market-card .card-top{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:6px}
  .market-card .card-times,.market-card .session-progress{display:none}
  .market-name{font-size:14px}
  .market-ticker{font-size:10px}
  .card-bottom .next-event{font-size:11px;margin-top:2px}
  .countdown-strip{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc(33.3333% - 6.67px);overflow-x:auto;gap:10px;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x mandatory;background:none;border:0;border-radius:0;mask-image:linear-gradient(to right,#000 92%,transparent);-webkit-mask-image:linear-gradient(to right,#000 92%,transparent)}
  .countdown-strip::-webkit-scrollbar{display:none}
  .countdown-item{scroll-snap-align:start;padding:10px 12px;flex-direction:column;align-items:flex-start;gap:4px}
  .countdown-label{font-size:10px;letter-spacing:.04em}
  .countdown-val{font-size:12px}
  .session-timeline{height:22px;border-radius:14px}
  .session-block{font-size:0}
  .time-ruler-tick:nth-child(2n){display:none}
  .session-bar-header{flex-wrap:wrap;gap:8px}
  .session-bar-key{flex-wrap:wrap;gap:8px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="glass-bg" aria-hidden="true">
  <div class="glass-blob pink"></div><div class="glass-blob blue"></div>
  <div class="glass-blob amber"></div><div class="glass-blob pink2"></div>
  <div class="glass-blob blue2"></div><div class="glass-blob amber2"></div>
</div>

<header class="header">
  <div style="display:flex;align-items:center;gap:16px">
    <h1 class="logo" style="font-size:11px">MKT<span>CLOCK</span></h1>
    <button class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Light mode">
  <svg class="toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <span class="toggle-track" id="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
  <svg class="toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
  </div>
  <div class="header-clock">
    <div id="local-time">--:--:--</div>
    <div id="local-date">&nbsp;</div>
    <div id="local-tz">&nbsp;</div>
  </div>
</header>

<main class="main">

  <section class="session-bar-wrap" aria-label="24 hour session overview">
    <div class="session-bar-header">
      <div class="section-label" id="sessions-label">24H SESSION OVERVIEW — UTC / LOCAL</div>
      <div class="session-bar-key">
        <div class="key-item"><span class="key-swatch hatch"></span>PRE-MARKET</div>
        <div class="key-item" id="kz-key-item" hidden><span class="key-swatch kz"></span>KILL ZONE</div>
        <button class="kz-toggle-btn" id="kz-toggle" role="switch" aria-checked="false" aria-controls="kz-row">
          <span class="kz-pip" id="kz-pip" aria-hidden="true"><span class="kz-pip-dot"></span></span>
          KILL ZONES
        </button>
      </div>
    </div>
    <div class="session-timeline" id="session-timeline" aria-hidden="true">
      <div class="current-time-needle" id="time-needle"></div>
    </div>
    <div class="kz-row" id="kz-row" hidden></div>
    <div class="time-ruler" id="time-ruler" aria-hidden="true"></div>
  </section>

  <div class="section-header">
    <div class="section-label">NEXT OPEN / CLOSE</div>
    <div class="section-divider"></div>
  </div>
  <div class="countdown-strip" id="countdown-strip" aria-live="off"></div>

  <div class="section-header">
    <div class="section-label">EQUITY MARKETS</div>
    <div class="section-divider"></div>
    <button class="kz-toggle-btn" id="hide-closed" role="switch" aria-checked="false" aria-controls="markets-grid">
      <span class="kz-pip" id="hide-closed-pip" aria-hidden="true"><span class="kz-pip-dot"></span></span>
      HIDE CLOSED
    </button>
  </div>
  <div class="markets-grid" id="markets-grid"></div>
  <div class="empty-state" id="empty-state" hidden>
    <strong>ALL EQUITY MARKETS CLOSED</strong>
    <span id="empty-next">—</span>
  </div>

  <div class="section-header">
    <div class="section-label">FX PAIRS</div>
    <div class="section-divider"></div>
  </div>
  <div class="forex-row" id="forex-row"></div>

</main>

<footer class="footer">
  <div><span class="live-dot"></span>LIVE — SYNCED TO DEVICE CLOCK</div>
  <div id="last-update">LAST UPDATE: —</div>
  <div>TIMES IN YOUR LOCAL TIMEZONE</div>
</footer>

<div class="sr" aria-live="polite" id="announcer"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
